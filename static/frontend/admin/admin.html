<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEC - Admin</title>

    <link rel="stylesheet" href="/shared/shell.css" />
    <link rel="stylesheet" href="admin.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ==================== NAVBAR ==================== -->
    <nav>
      <div class="nav-left">
        <img src="/images/CEC_LOGO.png" alt="CEC Logo" />
        <h1>CEC - Admin</h1>
      </div>

      <div class="nav-right">
        <div class="avatar-wrapper">
          <div class="avatar" id="avatarBtn">
            <i class="fa-solid fa-user"></i>
          </div>

          <div class="avatar-dropdown" id="avatarDropdown">
            <p class="dropdown-name" id="officerName">Admin</p>
            <p class="dropdown-role" id="officerRole">Administrator</p>
            <button id="changePasswordBtn">Change Password</button>
            <button id="logoutBtn">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- ==================== PAGE BODY ==================== -->
    <div class="page-body">
      <!-- ==================== SIDEBAR ==================== -->
      <aside class="sidebar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search" />
        </div>

        <a class="nav-item active" href="#" id="dashboardBtn">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <a class="nav-item" href="#" id="announcementsBtn">
          <i class="fa-solid fa-bullhorn"></i>
          Announcements
        </a>

        <a class="nav-item" href="#" id="userAccountsBtn">
          <i class="fa-solid fa-user"></i>
          User Accounts
        </a>
      </aside>

      <!-- ==================== MAIN ==================== -->
      <main>
        <p id="message"></p>

        <div class="content" id="content">
          <div class="welcome-section">
            <h1>Admin Dashboard</h1>
            <p>Select an option from the sidebar.</p>
          </div>
        </div>
      </main>
    </div>

    <!-- ==================== ADD / EDIT USER MODAL ==================== -->
    <div class="modal-overlay" id="userModal" style="display: none">
      <div class="modal">
        <h3 id="modalTitle">Add New User</h3>

        <form id="userForm">
          <input type="hidden" id="formId" />

          <label for="formUsername">Username</label>
          <input type="text" id="formUsername" required />

          <label for="formEmail">Email</label>
          <input type="email" id="formEmail" required />

          <label for="formRole">Role</label>
          <select id="formRole"></select>
          <p class="hint" id="roleDisplay" style="display: none"></p>

          <label for="formPassword">Password</label>
          <input type="password" id="formPassword" />
          <p class="hint" id="passwordHint">Required for new accounts.</p>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancelBtn">
              Cancel
            </button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/shared/app.js"></script>
    <script src="/shared/announcements.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
