<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cebu Eastern College, Inc. - Enrollment Form</title>

    <link rel="stylesheet" href="form1.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- Header Section -->
    <header class="header">

        <div class="logo-container">

            <img
                src="../images/CEC_LOGO.png"
                alt="Cebu Eastern College Logo"
                class="logo"
            >

            <h1 class="school-name">
                Cebu Eastern College, Inc.
            </h1>

        </div>

        <!-- Back Button -->
        <button
            type="button"
            class="back-button"
            id="backButton"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </button>

    </header>


    <!-- Main Container -->
    <main class="container">

        <div class="form-title-container">

            <h2 class="main-title">
                COLLEGE DEPARTMENT
            </h2>

            <p class="sub-title" id="sub-title">
                ENROLLMENT FORM
            </p>

        </div>


        <form
            class="enrollment-form"
            id="enrollmentForm"
        >


            <!-- =========================================
                 ENROLLEE PERSONAL INFORMATION
            ========================================== -->

            <fieldset class="form-section">

                <legend class="section-badge">
                    Enrollee Personal Information
                </legend>


                <div class="personal-info-grid">


                    <!-- Photo Upload Area -->

                    <div class="photo-upload-container">

                        <label
                            for="photo-input"
                            class="photo-box"
                        >

                            <span class="plus-icon">
                                +
                            </span>

                            <input
                                type="file"
                                id="photo-input"
                                accept="image/*"
                                hidden
                            >

                        </label>


                        <p class="photo-instruction">

                            Provide your 2x2 mugshot.<br>

                            The image must be less than 2MB.

                        </p>

                    </div>



                    <!-- Fields Area -->

                    <div class="fields-container">


                        <!-- First Name / Suffix -->

                        <div class="field-row split-2">

                            <div class="form-group">

                                <label for="first-name">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="first-name"
                                    name="first_name"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="suffix">
                                    Suffix
                                </label>

                                <div class="select-wrapper">

                                    <select
                                        id="suffix"
                                        name="suffix"
                                    >

                                        <option value=""></option>

                                        <option value="Jr.">
                                            Jr.
                                        </option>

                                        <option value="Sr.">
                                            Sr.
                                        </option>

                                        <option value="III">
                                            III
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>



                        <!-- Middle Name / Birthdate -->

                        <div class="field-row split-2">

                            <div class="form-group">

                                <label for="middle-name">
                                    Middle Name
                                </label>

                                <input
                                    type="text"
                                    id="middle-name"
                                    name="middle_name"
                                >

                            </div>


                            <div class="form-group">

                                <label for="birthdate">
                                    Birthdate (MM/DD/YY)
                                </label>

                                <div class="date-wrapper">

                                    <input
                                        type="date"
                                        id="birthdate"
                                        name="birthdate"
                                    >

                                </div>

                            </div>

                        </div>



                        <!-- Last Name / Phone -->

                        <div class="field-row split-2">

                            <div class="form-group">

                                <label for="last-name">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="last-name"
                                    name="last_name"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="phone">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                >

                            </div>

                        </div>



                        <!-- Email -->

                        <div class="field-row">

                            <div class="form-group">

                                <label for="email">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                >

                            </div>

                        </div>



                        <!-- Home Address -->

                        <div class="field-row">

                            <div class="form-group">

                                <label for="home-address">
                                    Home Address
                                </label>

                                <input
                                    type="text"
                                    id="home-address"
                                    name="home_address"
                                    required
                                >

                            </div>

                        </div>


                    </div>

                </div>

            </fieldset>

            <!-- =========================================
                 ACTION BUTTON
            ========================================== -->

            <div class="button-container">

                <button
                    type="button"
                    class="submit-btn"
                    id="proceedNext"
                >
                    PROCEED NEXT
                </button>

            </div>


        </form>

    </main>


    <!-- Separate JavaScript -->
    <script src="enrollment.js"></script>

</body>

</html>
