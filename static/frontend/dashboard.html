<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .dashboard-container {
        background: #1f2937;
        padding: 30px;
        width: 350px;
        border-radius: 10px;
      }

      h2 {
        text-align: center;
      }

      #message {
        text-align: center;
        margin-top: 10px;
      }

      #userDetails {
        margin-top: 20px;
        padding: 15px;
        background: #374151;
        border-radius: 5px;
      }

      #userDetails p {
        margin: 8px 0;
      }

      #changepass {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: navy;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #logoutBtn {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #changepass:hover {
        background: lightskyblue;
      }

      #logoutBtn:hover {
        background: #b91c1c;
      }
    </style>
  </head>

  <body>
    <div class="dashboard-container">
      <h2>User Details</h2>

      <p id="message"></p>

      <div id="userDetails">
        <p>
          <strong>Username:</strong>
          <span id="displayUsername"></span>
        </p>

        <p>
          <strong>Email:</strong>
          <span id="displayEmail"></span>
        </p>

        <p>
          <strong>Role:</strong>
          <span id="displayRole"></span>
        </p>
      </div>

      <button id="changepass" href="changepassword.html">
        Change Password
      </button>

      <button id="logoutBtn">Logout</button>
    </div>

    <script>
      // CHANGE THIS TO YOUR BACKEND URL
      const API_URL = "";

      const message = document.getElementById("message");

      // GET USER DETAILS
      async function getUserDetails() {
        const token = localStorage.getItem("token");

        if (!token) {
          return;
        }

        try {
          const response = await fetch(
            `/api/getUserDetails`,
            {
              method: "GET",

              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          if (!response.ok) {
            document.getElementById("message").textContent =
              "Session expired. Please login again.";

            localStorage.removeItem("token");

            return;
          }

          const user = await response.json();

          document.getElementById("displayUsername").textContent =
            user.username;

          document.getElementById("displayEmail").textContent = user.email;

          document.getElementById("displayRole").textContent = user.role;

          document.getElementById("userDetails").style.display = "block";
        } catch (error) {
          console.error(error);

          document.getElementById("message").textContent =
            "Failed to get user details.";
        }
      }

      document
        .getElementById("changepass")
        .addEventListener("click", function () {
          window.location.href = "changepassword.html";
        });

      // LOGOUT
      document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {
          localStorage.removeItem("token");
          window.location.href = "index.html";
        });

      // Run on page load
      getUserDetails();
    </script>
  </body>
</html>
